global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'apigateway'
    static_configs:
      - targets: ['apigateway:8080']
    metrics_path: /metrics

  - job_name: 'logservice'
    static_configs:
      - targets: ['logservice:8080']
    metrics_path: /metrics

  - job_name: 'incidentservice'
    static_configs:
      - targets: ['incidentservice:8080']
    metrics_path: /metrics